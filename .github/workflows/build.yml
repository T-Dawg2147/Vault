name: Build

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Vault.slnx
      - run: dotnet build Vault.slnx -c Release --no-restore
      - run: dotnet test Vault.Tests/Vault.Tests.csproj -c Release --no-build

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish Vault.App/Vault.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish/${{ matrix.rid }}
      - name: Bundle macOS .app
        if: startsWith(matrix.rid, 'osx-')
        run: ./scripts/bundle-macos.sh publish/${{ matrix.rid }} publish/Vault-${{ matrix.rid }}.app
      - uses: actions/upload-artifact@v4
        with:
          name: vault-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.rid, 'osx-')
        with:
          name: vault-${{ matrix.rid }}-app
          path: publish/Vault-${{ matrix.rid }}.app
